# Vhost cdn.synco.one (cf. docs/plan/08-exploitation.md#nginx).
upstream synco_cdn {
    server 127.0.0.1:9100;
    keepalive 256;
}

server {
    listen 443 ssl;
    http2 on;
    server_name cdn.synco.one;

    # ssl_certificate     /etc/letsencrypt/live/cdn.synco.one/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/cdn.synco.one/privkey.pem;

    client_max_body_size    80m;    # > taille d'une part
    client_body_timeout     30s;
    proxy_request_buffering off;    # parts transmises au fil de l'eau
    proxy_buffering         off;    # téléchargements idem
    proxy_http_version      1.1;
    proxy_set_header        Connection "";
    proxy_read_timeout      60s;
    proxy_send_timeout      60s;
    http2_body_preread_size 1m;

    location / {
        proxy_pass http://synco_cdn;
    }

    # Uniquement avec [downloads] mode = "accel".
    location /_cdn_files/ {
        internal;
        alias /srv/synco/storage/;
        sendfile on;
        tcp_nopush on;
    }
}
