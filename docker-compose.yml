# Déploiement de synco-cdn (cf. docs/deploiement-docker.md).
#
#   docker/init.sh                 # une fois : .env, secrets, clés de tickets
#   docker compose up -d --build
#   docker compose ps              # état « healthy » attendu
#
# Toutes les valeurs se règlent dans .env (modèle : .env.example).

name: synco-cdn

services:
  cdn:
    build:
      context: .
      dockerfile: Dockerfile
    image: synco-cdn:${CDN_IMAGE_TAG:-latest}
    restart: unless-stopped

    # Doit pouvoir lire, écrire, renommer et supprimer dans le stockage
    # partagé avec synco_api : même UID/GID que le propriétaire de CDN_DATA_DIR.
    user: "${CDN_UID:-10001}:${CDN_GID:-10001}"

    volumes:
      # FM_DATA_DIR de synco_api. Le CDN y écrit <id>.enc et .cdn-uploads/.
      # CDN_DATA_MOUNT_OPTIONS=z sur un hôte SELinux (Fedora, RHEL, Rocky) :
      # docker/init.sh le règle automatiquement.
      - ${CDN_DATA_DIR:?Définir CDN_DATA_DIR dans .env}:/data:${CDN_DATA_MOUNT_OPTIONS:-rw}
      # Secret HMAC partagé avec synco_api. Monté en volume plutôt qu'en
      # `secrets:` : l'option z (sans effet hors SELinux) le rend lisible
      # par le conteneur sur un hôte SELinux.
      - ${CDN_INTERNAL_SECRET_FILE:-./secrets/cdn_internal_secret}:/run/secrets/cdn_internal_secret:ro,z

    ports:
      # Public : derrière nginx (cdn.synco.one). Interne : synco_api et
      # Prometheus uniquement. Les deux sur la boucle locale par défaut.
      - "${CDN_PUBLIC_BIND:-127.0.0.1:9100}:9100"
      - "${CDN_INTERNAL_BIND:-127.0.0.1:9101}:9101"

    # Pour joindre synco_api sur l'hôte (CDN_API_INTERNAL_URL par défaut).
    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      SYNCO_CDN_TICKETS__PUBLIC_KEYS: ${CDN_TICKET_PUBLIC_KEYS:?Lancer docker/init.sh ou définir CDN_TICKET_PUBLIC_KEYS}
      SYNCO_CDN_API__INTERNAL_URL: ${CDN_API_INTERNAL_URL:-http://host.docker.internal:9002}
      SYNCO_CDN_CORS__ALLOWED_ORIGINS: ${CDN_CORS_ALLOWED_ORIGINS:-[]}
      SYNCO_CDN_STORAGE__MIN_FREE_BYTES: ${CDN_MIN_FREE_BYTES:-20GiB}
      SYNCO_CDN_STORAGE__MIN_FREE_PERCENT: ${CDN_MIN_FREE_PERCENT:-5}
      SYNCO_CDN_LIMITS__MAX_FILE_BYTES: ${CDN_MAX_FILE_BYTES:-10GiB}
      SYNCO_CDN_LIMITS__BUFFER_BUDGET_BYTES: ${CDN_BUFFER_BUDGET_BYTES:-512MiB}
      SYNCO_CDN_DOWNLOADS__MODE: ${CDN_DOWNLOAD_MODE:-direct}
      SYNCO_CDN_LOG__LEVEL: ${CDN_LOG_LEVEL:-info}

    # Cloisonnement : système de fichiers en lecture seule (seul /data est
    # inscriptible), aucune capacité, pas d'élévation de privilèges.
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    sysctls:
      net.core.somaxconn: 65535

    deploy:
      resources:
        limits:
          memory: ${CDN_MEMORY_LIMIT:-2g}

    # Aussi déclarée dans le Dockerfile, mais les images construites par
    # Podman (format OCI) ne conservent pas HEALTHCHECK : déclarée ici, elle
    # s'applique partout. /readyz échoue si le stockage est illisible ou plein.
    healthcheck:
      test: ["CMD", "/usr/local/bin/synco-cdn", "--healthcheck"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3

    # Le CDN termine les requêtes en cours (30 s max) avant de s'arrêter.
    stop_grace_period: 40s

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
