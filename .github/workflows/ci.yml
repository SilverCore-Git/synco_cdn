name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml fixe la version et les composants (clippy, rustfmt).
      - name: Format
        run: cargo fmt --check
      - name: Lints « zéro panique »
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --locked
      - name: Vecteurs de tickets à jour
        run: node tests/vectors/generate.mjs && git diff --exit-code tests/vectors
      - name: Cibles de fuzzing (compilation)
        run: cargo check --locked --manifest-path fuzz/Cargo.toml
      - name: Build release
        run: cargo build --release --locked
