# Cibles de fuzzing (cf. docs/plan/09-tests-benchmarks.md#fuzzing-cargo-fuzz).
#
#   fuzz/setup.sh              # toolchain nightly + cargo-fuzz (versions de versions.env)
#   fuzz/run.sh all 300        # 5 minutes par cible
#
# Critère : aucune panique, aucun dépassement de temps. Cf. fuzz/README.md.

[package]
name = "synco-cdn-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

# Mêmes versions que le service (cf. ../Cargo.toml).
[dependencies]
libfuzzer-sys = "0.4.13"
synco-cdn = { path = "..", default-features = false }
http = "1.5.0"
ed25519-dalek = "3.0.0"
base64 = "0.23.1"
serde_json = "1.0.151"

# Hors de l'espace de travail du service.
[workspace]
members = ["."]

[[bin]]
name = "ticket"
path = "fuzz_targets/ticket.rs"
test = false
doc = false
bench = false

[[bin]]
name = "range"
path = "fuzz_targets/range.rs"
test = false
doc = false
bench = false

[[bin]]
name = "config"
path = "fuzz_targets/config.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ticket_claims"
path = "fuzz_targets/ticket_claims.rs"
test = false
doc = false
bench = false

[[bin]]
name = "path"
path = "fuzz_targets/path.rs"
test = false
doc = false
bench = false

[[bin]]
name = "session_record"
path = "fuzz_targets/session_record.rs"
test = false
doc = false
bench = false
